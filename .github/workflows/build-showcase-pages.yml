name: Build showcase pages
on:
  push:
    paths:
      - Beachcomber.pdf
      - .github/workflows/build-showcase-pages.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render lightweight guide pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p assets/showcase
          rm -f assets/showcase/page-*.jpg
          pdftoppm -jpeg -r 120 -jpegopt quality=86,progressive=y,optimize=y Beachcomber.pdf assets/showcase/page
          i=1
          for f in assets/showcase/page-*.jpg; do
            printf -v n "%02d" "$i"
            mv "$f" "assets/showcase/page-$n.jpg"
            i=$((i+1))
          done
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase
          git diff --cached --quiet || git commit -m "Render Beachcomber showcase pages"
          git push
